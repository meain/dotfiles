<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Picker</title>
<style>
body{font:15px/1.5 -apple-system,system-ui,sans-serif;color:#1f2933;background:#fff;max-width:1240px;margin:28px auto 120px;padding:0 20px}
h1{font-size:26px;margin:0 0 4px}.sub{color:#667;margin:0 0 14px}
h2.grp{font-size:17px;margin:26px 0 10px;border-bottom:1px solid #e3e8ee;padding-bottom:5px}
.legend{font-size:13px;color:#667;margin-bottom:14px}
.grid{display:grid;gap:18px}
.card{display:block;border:2px solid #e3e8ee;border-radius:10px;padding:12px 14px;cursor:pointer;position:relative;background:#fff;transition:border-color .1s,background .1s}
.card:hover{border-color:#b8c4d0}.card.on{border-color:#2f9e44;background:#f3fbf5}.card.has{box-shadow:inset 4px 0 0 #5fa8ff}
.card input[type=checkbox],.card input[type=radio]{position:absolute;opacity:0;pointer-events:none}
.ch{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.num{background:#1f2933;color:#fff;border-radius:50%;min-width:26px;height:26px;padding:0 4px;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.ttl{font-weight:700;font-size:16px;flex:1}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;background:#eef2f7;color:#445}
.tag.good{background:#dff5e3;color:#1a6b2c}.tag.warn{background:#fff3cd;color:#8a6500}.tag.bad{background:#fde2e2;color:#a33}.tag.rec{background:#dbeafe;color:#1e4fa3}
.card p.desc{margin:6px 0 8px;color:#445;font-size:14px}
.meta{font-size:12.5px;color:#667}
.pick{display:none;color:#1a6b2c;background:#dff5e3;font-weight:700;font-size:11px;border-radius:10px;padding:2px 8px}.card.on .pick{display:inline-block}
.mock{margin:6px 0 8px;overflow-x:auto}
.mock.html{border:1px solid #e3e8ee;border-radius:8px;padding:10px;background:#fafbfc}
pre.term{background:#13232f;color:#d6dde3;font:12.5px/1.3 "SF Mono",Menlo,Consolas,monospace;padding:10px 12px;border-radius:8px;overflow-x:auto;margin:6px 0 8px}
.c{color:#5fd7ff}.cb{color:#5fd7ff;font-weight:700}.g{color:#3fd13f}.r{color:#ff5555}.rb{color:#ff5555;font-weight:700}
.y{color:#e8c547}.yb{color:#e8c547;font-weight:700}.m{color:#d070d0}.d{color:#6f8290}.b{font-weight:700}
.chip-r{background:#ff5555;color:#13232f;font-weight:700}.chip-y{background:#e8c547;color:#13232f;font-weight:700}.chip-g{background:#3fd13f;color:#13232f;font-weight:700}.chip-d{background:#3a4d5b;color:#d6dde3}
.tab{background:#243745;color:#d6dde3}.tabsel{background:#5fd7ff;color:#13232f;font-weight:700}
.sel{background:#d6dde3;color:#13232f;font-weight:700}.hl{background:#5a4a12;color:#ffe9a0}
textarea.cm{display:block;width:100%;box-sizing:border-box;margin-top:8px;border:1px solid #cfd8e0;border-radius:6px;padding:6px 8px;font:13.5px/1.4 -apple-system,system-ui,sans-serif;resize:vertical;background:#fff;color:#1f2933}
textarea.cm:focus{outline:2px solid #5fa8ff;border-color:#5fa8ff}
.bar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);width:min(880px,calc(100vw - 32px));box-sizing:border-box;background:rgba(255,255,255,.86);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);border:1px solid rgba(31,41,51,.12);border-radius:16px;box-shadow:0 10px 34px rgba(31,41,51,.18),0 1px 3px rgba(31,41,51,.1);padding:10px 12px 10px 16px;display:flex;align-items:center;gap:12px;z-index:10}
.bar .status{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.bar .count{font-size:13px;font-weight:700;color:#1f2933;white-space:nowrap}.bar .count small{font-weight:500;color:#667;font-size:12.5px;margin-left:2px}
.bar .chips{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;min-width:0;mask-image:linear-gradient(90deg,#000 92%,transparent)}.bar .chips::-webkit-scrollbar{display:none}
.bar .chips i{font-style:normal;font-size:12px;font-weight:700;color:#1a6b2c;background:#dff5e3;border-radius:999px;padding:1px 9px;white-space:nowrap}
.bar .empty{font-size:13px;color:#8a97a3}
.bar .notes{font-size:12px;font-weight:600;color:#1e4fa3;background:#dbeafe;border-radius:999px;padding:1px 9px;white-space:nowrap}
.bar button{font:600 13.5px -apple-system,system-ui,sans-serif;border:0;border-radius:10px;padding:8px 14px;cursor:pointer;white-space:nowrap;transition:background .12s,transform .06s}
.bar button:active{transform:scale(.97)}
.bar button.alt{background:transparent;color:#52606d}.bar button.alt:hover{background:rgba(31,41,51,.07);color:#1f2933}
.bar button.go{background:#1f2933;color:#fff;padding:8px 18px}.bar button.go:hover{background:#0f171e}.bar button.go.done{background:#2f9e44}
.bar .sep{width:1px;height:22px;background:rgba(31,41,51,.14)}
</style></head><body>
<h1 id="title"></h1>
<p class="sub" id="subtitle"></p>
<div class="legend" id="legend"></div>
<div id="root"></div>
<div class="bar"><div class="status"><span class="count" id="count"></span><div class="chips" id="list"></div><span class="notes" id="notes" hidden></span></div><button class="alt" id="all">Select all</button><button class="alt" id="none">Clear</button><span class="sep"></span><button class="go" id="copy">Copy picks + notes</button></div>
<script id="data" type="application/json">/*OPTIONS_JSON*/</script>
<script>
const cfg=JSON.parse(document.getElementById('data').textContent);
const single=cfg.mode==='single';
const skey='picker:'+(cfg.id||'default'), ckey=skey+':notes';
document.title=cfg.title||'Picker';
document.getElementById('title').textContent=cfg.title||'Pick';
document.getElementById('subtitle').innerHTML=(cfg.subtitle||'')+(cfg.subtitle?' ':'')+
 (single?'Click a card to choose one.':'Click cards to pick (green border).')+' Each card has a note box for the agent; notes are independent of picking. The bar copies picks plus notes so you can paste them back.';
if(cfg.legend)document.getElementById('legend').innerHTML=cfg.legend;
document.getElementById('all').style.display=single?'none':'';
const root=document.getElementById('root');
const cols=Math.max(1,Math.min(3,cfg.columns||2));
let grid=null,lastGroup=null;
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
for(const o of cfg.options){
  if(!grid||(o.group||null)!==lastGroup){
    if(o.group){const h=document.createElement('h2');h.className='grp';h.textContent=o.group;root.appendChild(h)}
    grid=document.createElement('div');grid.className='grid';grid.style.gridTemplateColumns='repeat('+cols+',minmax(0,1fr))';root.appendChild(grid);lastGroup=o.group||null;
  }
  const tags=(o.recommended?[{text:'suggested',kind:'rec'}]:[]).concat(o.tags||[]).map(t=>'<span class="tag '+esc(t.kind||'')+'">'+esc(t.text)+'</span>').join('');
  let mock='';
  if(o.mockup){mock=(o.mockup_kind==='html')?'<div class="mock html">'+o.mockup+'</div>':(o.mockup_kind==='text')?'<pre class="term">'+esc(o.mockup)+'</pre>':'<pre class="term">'+o.mockup+'</pre>'}
  const card=document.createElement('label');card.className='card';card.dataset.id=o.id;
  card.innerHTML='<input type="'+(single?'radio':'checkbox')+'" name="pick" value="'+esc(o.id)+'">'+
   '<div class="ch"><span class="num">'+esc(o.id)+'</span><span class="ttl">'+esc(o.title)+'</span>'+tags+'<span class="pick">✓ '+(single?'chosen':'picked')+'</span></div>'+
   (o.desc?'<p class="desc">'+o.desc+'</p>':'')+mock+(o.meta?'<div class="meta">'+o.meta+'</div>':'')+
   '<textarea class="cm" data-id="'+esc(o.id)+'" data-title="'+esc(o.title)+'" rows="2" placeholder="Note for the agent on this option (optional; does not pick it)"></textarea>';
  grid.appendChild(card);
}
const boxes=[...document.querySelectorAll('.card input')];
const areas=[...document.querySelectorAll('textarea.cm')];
const saved=JSON.parse(localStorage.getItem(skey)||'[]');
const notes=JSON.parse(localStorage.getItem(ckey)||'{}');
function picked(){return boxes.filter(b=>b.checked).map(b=>b.value)}
function render(){const on=picked();
  boxes.forEach(b=>b.closest('.card').classList.toggle('on',b.checked));
  areas.forEach(a=>a.closest('.card').classList.toggle('has',!!a.value.trim()));
  const nc=areas.filter(a=>a.value.trim()).length;
  const total=boxes.length;
  document.getElementById('count').innerHTML=single?(on.length?'Chosen':'Nothing chosen yet'):(on.length+'<small> of '+total+' picked</small>');
  document.getElementById('list').innerHTML=on.length?on.map(i=>'<i>'+esc(i)+'</i>').join(''):(single?'':'<span class="empty">Click cards to pick</span>');
  const nb=document.getElementById('notes');nb.hidden=!nc;nb.textContent=nc+' note'+(nc>1?'s':'');
  localStorage.setItem(skey,JSON.stringify(on));
  const n={};areas.forEach(a=>{if(a.value.trim())n[a.dataset.id]=a.value});localStorage.setItem(ckey,JSON.stringify(n));
  return on}
function summary(){const on=render();let t=(single?'Chosen: ':'Picked: ')+(on.length?on.join(', '):'none');
  const lines=areas.filter(a=>a.value.trim()).map(a=>a.dataset.id+'. '+a.dataset.title+': '+a.value.trim().replace(/\n+/g,' '));
  if(lines.length)t+='\n\nNotes for the agent (independent of picks):\n'+lines.join('\n');return t}
boxes.forEach(b=>{b.checked=saved.includes(b.value);b.addEventListener('change',render)});
areas.forEach(a=>{a.value=notes[a.dataset.id]||'';a.addEventListener('input',render);a.addEventListener('click',e=>e.stopPropagation());a.addEventListener('keydown',e=>e.stopPropagation())});
document.getElementById('all').onclick=()=>{boxes.forEach(b=>b.checked=true);render()};
document.getElementById('none').onclick=()=>{boxes.forEach(b=>b.checked=false);areas.forEach(a=>a.value='');render()};
document.getElementById('copy').onclick=async e=>{const b=e.currentTarget,label='Copy picks + notes',t=summary();try{await navigator.clipboard.writeText(t);b.textContent='Copied ✓';b.classList.add('done')}catch(_){prompt('Copy this:',t)}setTimeout(()=>{b.textContent=label;b.classList.remove('done')},1600)};
render();
</script></body></html>
