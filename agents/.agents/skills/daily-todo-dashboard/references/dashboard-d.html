<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Todo dashboard</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.45 -apple-system,system-ui,sans-serif;background:#f6f7f9;color:#1d2330;display:flex;flex-direction:column}
header{display:flex;gap:14px;align-items:center;padding:12px 24px;background:#fff;border-bottom:1px solid #dde1e8}
header h1{font-size:18px;margin:0}
header .sub{color:#889;font-size:12.5px}
header .sp{margin-left:auto}
button{font:inherit;font-size:13px;padding:6px 12px;border:1px solid #cfd5df;border-radius:8px;background:#fff;cursor:pointer}
button.p{background:#2f6fed;color:#fff;border-color:#2f6fed}
#next{background:#fff;border-bottom:1px solid #dde1e8;padding:8px 24px;font-size:13px;display:none;gap:10px;flex-wrap:wrap;align-items:center}
#next .lbl{color:#889;font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin-right:4px}
.ev{background:#eef0f4;border-radius:8px;padding:3px 10px;color:#334}
.ev.nx{background:#1d2330;color:#fff}.ev.past{opacity:.45}.ev.opt{background:#fff;border:1px dashed #bbc}
.ev i{font-style:normal;color:#889;margin-right:6px}.ev.nx i{color:#aab}
#app{flex:1;display:grid;grid-template-columns:1fr 440px;gap:16px;padding:16px 24px;overflow:hidden}
#board{overflow:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-content:start}
.col{background:#fff;border:1px solid #e1e5ec;border-radius:12px;padding:12px 14px}
.col h3{margin:0;font-size:15px}.col .hd{color:#889;font-size:12px;display:block;margin-bottom:6px}
.it{display:flex;gap:8px;align-items:center;border-top:1px solid #eef0f4;padding:8px 6px;cursor:pointer;border-radius:8px}
.it:first-of-type{border-top:0}
.it.sel{background:#f1f5ff}
.it.done .t{text-decoration:line-through;color:#aab}
.it .t{flex:1}
.pill{font-size:11px;padding:1px 7px;border-radius:99px;background:#e6ecfb;color:#2a4fa8;white-space:nowrap}
.pill.m{background:#e3f4e8;color:#23703a}.pill.t{background:#fdeed8;color:#9a5b0a}.pill.r{background:#fde6e6;color:#a32a2a}.pill.g{background:#eef0f4;color:#556}
#drawer{background:#fff;border:1px solid #2f6fed;border-radius:12px;padding:18px;overflow:auto}
#drawer.empty{border-color:#e1e5ec;color:#889}
#drawer h2{margin:0 0 6px;font-size:18px}
.k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#889;margin:16px 0 4px}
table{width:100%;border-collapse:collapse;font-size:13px}
td{padding:5px 0;border-top:1px solid #eef0f4;vertical-align:top}
td:last-child{text-align:right;white-space:nowrap}
a{color:#2f6fed;text-decoration:none}
.ok{color:#23703a}.bad{color:#a32a2a}.wait{color:#9a5b0a}
textarea{width:100%;min-height:70px;font:inherit;border:1px solid #dde1e8;border-radius:8px;padding:8px}
.acts button{margin:4px 6px 0 0}
.sched{font-size:12.5px;color:#556}
</style></head><body>
<header><h1 id="title"></h1><span class="sub" id="gen"></span><span class="sub" id="summary"></span>
<span class="sp"></span><button id="backlogPrompt">Copy backlog update prompt</button></header>
<div id="next"></div>
<div id="app"><div id="board"></div><aside id="drawer" class="empty">Select an item.</aside></div>

<script>
const DATA = /*DATA_JSON*/null;
const KEY = 'todo-dash-d-' + DATA.day;
const st = Object.assign({done:{},notes:{}}, JSON.parse(localStorage.getItem(KEY)||'{}'));
const save = () => localStorage.setItem(KEY, JSON.stringify(st));
const COLS = [
  ['Review', 'PR review'], ['Merge and chase', 'Merge', 'Chase review'], ['Build', 'Backlog'],
  ['Respond', 'Teams'], ['Blocked', 'Blocked']
];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const score = t => t.urg*2 + t.imp*2 + (t.blocks?3:0) + Math.min(t.age,10)*0.3 - (t.held?8:0);
const colOf = t => (t.held || t.src==='Blocked') ? 'Blocked' : COLS.find(c => c.slice(1).includes(t.src))[0];
let sel = null;

function pills(t){
  const p = [];
  if (t.blocks) p.push('<span class="pill r">blocks someone</span>');
  if (t.age >= 5) p.push(`<span class="pill r">${t.age}d</span>`);
  if (t.held) p.push('<span class="pill g">on hold</span>');
  return p.join(' ');
}
function renderBoard(){
  const live = DATA.todos;
  document.getElementById('board').innerHTML = COLS.map(([name]) => {
    const items = live.filter(t => colOf(t)===name).sort((a,b)=>score(b)-score(a));
    if (!items.length && name!=='Respond') return '';
    const open = items.filter(t=>!st.done[t.id]).length;
    return `<div class="col"><h3>${name}</h3><span class="hd">${open} open</span>` +
      (items.length ? items.map(t => `<div class="it ${sel===t.id?'sel':''} ${st.done[t.id]?'done':''}" data-id="${esc(t.id)}">
        <input type="checkbox" data-done="${esc(t.id)}" ${st.done[t.id]?'checked':''}>
        <span class="t">${esc(t.title)}</span>${t.age>=5?`<span class="pill r">${t.age}d</span>`:''}${t.blocks?'<span class="pill r">blocks</span>':''}</div>`).join('')
        : '<span class="hd">Nothing here.</span>') + '</div>';
  }).join('');
  document.querySelectorAll('.it').forEach(e => e.onclick = ev => {
    if (ev.target.dataset.done) return;
    sel = e.dataset.id; renderBoard(); renderDrawer();
  });
  document.querySelectorAll('[data-done]').forEach(e => e.onchange = () => {
    if (e.checked) st.done[e.dataset.done] = true; else delete st.done[e.dataset.done];
    save(); renderBoard(); summary();
  });
}
function stateCell(p){
  const cls = {approved:'ok', security:'bad', 'changes requested':'bad'}[p.state] || 'wait';
  return `<span class="${cls}">${esc(p.state||'')}</span>`;
}
function renderDrawer(){
  const d = document.getElementById('drawer'), t = DATA.todos.find(x=>x.id===sel);
  if (!t){ d.className='empty'; d.textContent='Select an item.'; return; }
  d.className='';
  const prs = t.prs || [];
  const prUrls = new Set(prs.map(p=>p.u));
  const others = t.links.filter(l => !prUrls.has(l.u));
  d.innerHTML = `<h2>${esc(t.title)}</h2>${pills(t)} <span class="pill">${esc(t.src)}</span> <span class="pill g">${esc(t.proj)}</span>
    <div class="k">Why</div>${esc(t.ctx)}
    ${prs.length ? `<div class="k">PRs</div><table>${prs.map(p=>`<tr><td><a href="${esc(p.u)}" target="_blank">${esc(p.t)}</a></td><td>${stateCell(p)}</td></tr>`).join('')}</table>` : ''}
    ${others.length ? `<div class="k">Links</div><table>${others.map(l=>`<tr><td><a href="${esc(l.u)}" target="_blank">${esc(l.t)}</a></td><td></td></tr>`).join('')}</table>` : ''}
    <div class="k">Notes</div><textarea id="note" placeholder="Notes (saved in this browser)">${esc(st.notes[t.id]||'')}</textarea>
    <div class="k">Actions</div><div class="acts">
      <button class="p" id="copyPrompt">Copy agent prompt</button>
      ${(prs.length||t.links.length)>1 ? '<button id="openAll">Open all links</button>' : ''}
      <button id="doneBtn">${st.done[t.id]?'Mark open':'Mark done'}</button></div>`;
  document.getElementById('note').oninput = e => { st.notes[t.id]=e.target.value; save(); };
  document.getElementById('doneBtn').onclick = () => { if (st.done[t.id]) delete st.done[t.id]; else st.done[t.id]=true; save(); renderBoard(); renderDrawer(); summary(); };
  const oa = document.getElementById('openAll');
  if (oa) oa.onclick = () => t.links.filter(l=>/^https?:/.test(l.u)).forEach(l=>window.open(l.u,'_blank'));
  document.getElementById('copyPrompt').onclick = e => copy(agentPrompt(t), e.target, 'Copy agent prompt');
}
function agentPrompt(t){
  const kind = t.tags.includes('review')
    ? 'Review these changes for correctness bugs and gaps. Report concise findings; do not post anything to GitHub.'
    : t.tags.includes('dev') ? 'Plan and implement this. Show me the plan first if it is non-trivial.'
    : 'Do what is needed to finish this, and tell me what you did.';
  const note = (st.notes[t.id]||'').trim();
  return [`Todo: ${t.title}`, `Source: ${t.src} | Project: ${t.proj} | Age: ${t.age}d`, '', 'Context:', t.ctx,
    t.links.length ? '\nLinks:\n' + t.links.map(l=>`- ${l.t}: ${l.u}`).join('\n') : '',
    note ? `\nMy notes:\n${note}` : '', '', kind].filter((x,i,a)=>x!==''||a[i-1]!=='').join('\n');
}
async function copy(text, btn, label){
  try { await navigator.clipboard.writeText(text); }
  catch { const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  btn.textContent='Copied ✓'; setTimeout(()=>btn.textContent=label,1500);
}
function summary(){
  const open = DATA.todos.filter(t=>!st.done[t.id]);
  document.getElementById('summary').textContent = `${open.length} open · ${open.filter(t=>t.age>=5).length} aging 5d+ · ${open.filter(t=>t.blocks).length} block others`;
}
function nextMeeting(){
  const mins = s => { const [h,m]=s.split(':').map(Number); return h*60+m; };
  const fmt = m => { const h=Math.floor(m/60)%24, mm=m%60; return `${((h+11)%12)+1}:${String(mm).padStart(2,'0')} ${h<12?'AM':'PM'}`; };
  const now = new Date(), cur = now.getHours()*60+now.getMinutes();
  const ev = (DATA.events||[]).map(e=>({...e, sm:mins(e.s), em:mins(e.e)})).sort((a,b)=>a.sm-b.sm);
  const el = document.getElementById('next');
  if (!ev.length) return;
  const nx = ev.find(e=>e.sm>cur && !e.opt);
  el.style.display='flex';
  el.innerHTML = '<span class="lbl">Today</span>' + ev.map(e =>
    `<span class="ev ${e===nx?'nx':''} ${e.em<=cur?'past':''} ${e.opt?'opt':''}"><i>${fmt(e.sm)} to ${fmt(e.em)}</i>${esc(e.t)}${e.opt?' (optional)':''}</span>`).join('');
}
document.getElementById('backlogPrompt').onclick = e => {
  const all = DATA.todos, done = all.filter(t=>st.done[t.id]), open = all.filter(t=>!st.done[t.id]);
  const fmt = t => `- ${t.title} (${t.src}${t.links.some(l=>l.t==='Task note')?', has a task note':''})`;
  copy([`Update my vault backlog for ${DATA.day}: /Users/meain/.local/share/sbdb/Backlog/Backlog.md. Use the /vault skill and follow the existing backlog format.`,
    done.length ? `\nDone (mark completed):\n${done.map(fmt).join('\n')}` : '',
    open.length ? `\nStill open (no change needed):\n${open.map(fmt).join('\n')}` : '',
    "\nOnly touch the items listed under Done. Match existing lines by title or their [[Tasks/...]] link. Done items that are not in the backlog yet (PR reviews, merges, Teams follow-ups) should be added as completed lines under today's section so they show up in the weekly report. Show me what you changed when you are done."
  ].filter(x=>x!=='').join('\n'), e.target, 'Copy backlog update prompt');
};
document.getElementById('title').textContent = DATA.title;
document.getElementById('gen').textContent = DATA.subtitle;
document.title = DATA.title;
renderBoard(); summary(); nextMeeting();
</script></body></html>
