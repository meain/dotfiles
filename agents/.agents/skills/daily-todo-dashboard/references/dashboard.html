<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Todo dashboard</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1c2230; --mute:#667085; --line:#e4e7ec; --red:#d92d20; --amber:#b54708; --green:#067647; --blue:#175cd3; --sel:#eef4ff; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body { font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); display:flex; flex-direction:column; }
  a { color:var(--blue); text-decoration:none; } a:hover { text-decoration:underline; }
  header { padding:10px 16px; background:var(--card); border-bottom:1px solid var(--line); display:flex; align-items:baseline; gap:14px; }
  header h1 { font-size:16px; margin:0; } header .sub { color:var(--mute); }
  #app { flex:1; display:grid; grid-template-columns:minmax(420px,46%) 1fr; min-height:0; }
  #left { border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0; background:var(--card); }
  #right { overflow:auto; padding:18px 24px; }
  .controls { padding:10px 12px; border-bottom:1px solid var(--line); display:grid; gap:8px; background:#fbfcfd; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  input[type=search], select { font:inherit; padding:4px 8px; border:1px solid var(--line); border-radius:6px; background:#fff; }
  input[type=search] { flex:1; min-width:140px; }
  label.chk { display:inline-flex; gap:4px; align-items:center; color:var(--mute); }
  .lbl { color:var(--mute); font-size:11px; text-transform:uppercase; letter-spacing:.04em; }
  .chips { display:flex; gap:5px; flex-wrap:wrap; }
  .chip { border:1px solid var(--line); border-radius:99px; padding:1px 9px; cursor:pointer; background:#fff; color:var(--mute); user-select:none; }
  .chip.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  details.weights { border:1px solid var(--line); border-radius:8px; padding:6px 10px; background:#fff; }
  details.weights summary { cursor:pointer; color:var(--mute); }
  .sliders { display:grid; grid-template-columns:repeat(2,1fr); gap:4px 16px; margin-top:6px; }
  .sliders label { display:flex; justify-content:space-between; gap:6px; align-items:center; }
  .sliders input { width:90px; }
  #list { overflow:auto; flex:1; }
  .grp { padding:6px 12px; background:#f2f4f7; font-weight:600; font-size:12px; color:var(--mute); position:sticky; top:0; border-bottom:1px solid var(--line); }
  .item { display:grid; grid-template-columns:22px 1fr auto; gap:8px; padding:8px 12px; border-bottom:1px solid var(--line); cursor:pointer; align-items:start; }
  .item:hover { background:#f9fafb; } .item.sel { background:var(--sel); }
  .item.done .title { text-decoration:line-through; color:#98a2b3; }
  .title { font-weight:500; }
  .meta { display:flex; gap:5px; flex-wrap:wrap; margin-top:3px; }
  .tag { font-size:11px; padding:0 7px; border-radius:99px; border:1px solid var(--line); color:var(--mute); background:#fff; }
  .p0 { color:var(--red); border-color:#fda29b; background:#fef3f2; font-weight:600; }
  .p1 { color:var(--amber); border-color:#fec84b; background:#fffaeb; font-weight:600; }
  .p2 { color:var(--blue); border-color:#a4bcfd; background:#eff4ff; }
  .p3 { color:var(--mute); }
  .ok { color:var(--green); border-color:#75e0a7; background:#ecfdf3; }
  .score { font-variant-numeric:tabular-nums; color:var(--mute); text-align:right; font-size:12px; }
  .pin { cursor:pointer; color:#d0d5dd; } .pin.on { color:#f79009; }
  h2 { margin:0 0 4px; font-size:18px; } h3 { margin:18px 0 6px; font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--mute); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 14px; }
  .bar { height:8px; border-radius:4px; background:#eaecf0; overflow:hidden; display:flex; }
  .bar i { display:block; height:100%; }
  table.bd { width:100%; border-collapse:collapse; } table.bd td { padding:3px 6px; border-bottom:1px solid var(--line); } table.bd td:last-child { text-align:right; font-variant-numeric:tabular-nums; }
  textarea { width:100%; min-height:70px; font:inherit; border:1px solid var(--line); border-radius:6px; padding:6px; }
  ul.links { margin:0; padding-left:18px; } ul.links li { margin:2px 0; }
  .empty { color:var(--mute); padding:40px; text-align:center; }
  .edit { display:flex; gap:14px; flex-wrap:wrap; align-items:center; } .edit label { display:flex; gap:6px; align-items:center; }
  details.fold { margin-top:16px; } details.fold summary { cursor:pointer; font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--mute); margin-bottom:6px; }
  button { font:inherit; padding:3px 10px; border:1px solid var(--line); border-radius:6px; background:#fff; cursor:pointer; }
  .acts { display:flex; gap:7px; align-items:center; color:#98a2b3; padding-top:1px; }
  .rm { cursor:pointer; } .rm:hover { color:var(--red); } .grip { cursor:grab; }
  .item.drag { opacity:.4; } .item.over-t { box-shadow:inset 0 2px 0 var(--blue); } .item.over-b { box-shadow:inset 0 -2px 0 var(--blue); }
  #sched { border-bottom:1px solid var(--line); max-height:36%; overflow:auto; background:#fff; }
  #sched summary { padding:6px 12px; cursor:pointer; font-weight:600; font-size:12px; color:var(--mute); }
  .blk { display:grid; grid-template-columns:140px 1fr; gap:8px; padding:4px 12px; border-top:1px solid #f2f4f7; font-size:12px; }
  .blk.meet { color:var(--mute); } .blk.focus .when { color:var(--green); font-weight:600; }
  .plan div { padding:1px 0; cursor:pointer; } .plan div:hover { text-decoration:underline; }
</style>
</head>
<body>
<header>
  <h1>Todo dashboard</h1>
  <span class="sub" id="gen"></span>
  <span class="sub" id="summary" style="margin-left:auto"></span>
  <button id="backlogPrompt">Copy backlog update prompt</button>
</header>
<div id="app">
  <div id="left">
    <div class="controls">
      <div class="row">
        <input type="search" id="q" placeholder="Search title, context, tags…">
        <select id="status">
          <option value="open">Open</option><option value="all">All</option><option value="done">Done</option><option value="removed">Removed</option>
        </select>
      </div>
      <div class="row"><span class="lbl">Source</span><div class="chips" id="srcChips"></div></div>
      <div class="row"><span class="lbl">Tag</span><div class="chips" id="tagChips"></div></div>
      <div class="row">
        <span class="lbl">Effort</span><div class="chips" id="effChips"></div>
        <label class="chk"><input type="checkbox" id="fOverdue"> overdue / aging (5d+)</label>
        <label class="chk"><input type="checkbox" id="fBlocksOthers"> blocks others</label>
        <label class="chk"><input type="checkbox" id="fHideHeld"> hide on-hold</label>
      </div>
      <details class="weights" id="sortbox"><summary>Sort, group &amp; prioritize</summary>
      <div class="row" style="margin-top:6px">
        <span class="lbl">Prioritize</span>
        <select id="preset"></select>
        <span class="lbl">Sort</span>
        <select id="sort">
          <option value="score">Priority score</option><option value="age">Age (oldest)</option><option value="urg">Urgency</option>
          <option value="imp">Impact</option><option value="eff">Effort (smallest)</option><option value="src">Source</option><option value="title">Title</option><option value="manual">Manual (my order)</option>
        </select>
        <span class="lbl">Group</span>
        <select id="group">
          <option value="none">None</option><option value="quad">Eisenhower quadrant</option><option value="prio">Priority (P0–P3)</option><option value="src">Source</option><option value="proj">Project</option>
        </select>
      </div>
      <div class="sliders" id="sliders"></div>
      </details>
    </div>
    <div id="sched"></div>
    <div id="list"></div>
  </div>
  <div id="right"></div>
</div>

<script>
const DATA = /*DATA_JSON*/null;
const TODOS = DATA.todos;

// Prioritization presets: weights for urgency, impact, unblock bonus, aging, quick-win (low effort), held penalty
const PRESETS = {
  balanced:  {n:'Balanced (default)',            u:2.0, i:2.0, b:3.0, a:1.0, q:1.0, h:8},
  deadline:  {n:'Urgency first',                  u:4.0, i:1.0, b:1.5, a:1.5, q:0.5, h:8},
  value:     {n:'Impact first',                   u:0.8, i:4.0, b:2.0, a:0.3, q:0.3, h:8},
  quick:     {n:'Quick wins (impact per effort)', u:1.0, i:1.5, b:2.0, a:0.5, q:4.0, h:8},
  unblock:   {n:'Unblock others first',           u:1.0, i:1.0, b:8.0, a:1.0, q:1.0, h:8},
  aging:     {n:'Oldest first (aging)',           u:0.5, i:0.5, b:1.0, a:4.0, q:0.5, h:8},
  flow:      {n:'Flow: small first, hold blocked',u:0.8, i:1.0, b:2.0, a:1.0, q:3.0, h:20},
};
const SLIDERS = [['u','Urgency',0,5],['i','Impact',0,5],['b','Unblock bonus',0,10],['a','Aging',0,5],['q','Quick-win (low effort)',0,5],['h','On-hold penalty',0,25]];
const EFF = {1:'S',2:'M',3:'L'};

const KEY = 'todo-dash-' + DATA.day;
let st = JSON.parse(localStorage.getItem(KEY) || '{}');
st.done = st.done||{}; st.edit = st.edit||{}; st.notes = st.notes||{}; st.pin = st.pin||{}; st.removed = st.removed||{}; st.order = st.order||[];
const ordIdx = id => { const i=st.order.indexOf(id); return i<0?1e6:i; };
const save = () => localStorage.setItem(KEY, JSON.stringify(st));

const ui = { q:'', status:'open', src:new Set(), tag:new Set(), eff:new Set(), overdue:false, blocks:false, hideHeld:false,
  preset:'balanced', w:{...PRESETS.balanced}, sort:'score', group:'none', sel:null };

const cur = t => ({...t, ...(st.edit[t.id]||{})});
function score(t){
  const w = ui.w, ageN = Math.min(t.age,10)/10*5;
  const parts = { Urgency:w.u*t.urg, Impact:w.i*t.imp, 'Unblocks others':t.blocks?w.b:0, Aging:w.a*ageN, 'Quick win':w.q*(4-t.eff),
                  'On hold':t.held?-w.h:0, Pinned:st.pin[t.id]?50:0 };
  return {total:Object.values(parts).reduce((a,b)=>a+b,0), parts};
}
const prio = t => (t.urg>=4&&t.imp>=4)?'P0':(t.urg>=4||t.imp>=4)?'P1':(t.urg>=3||t.imp>=3)?'P2':'P3';
const quad = t => (t.urg>=4&&t.imp>=4)?'1 Do now (urgent + important)':(t.imp>=4)?'2 Schedule (important)':(t.urg>=4)?'3 Quick handle (urgent)':'4 Later / drop';
const isDone = t => !!st.done[t.id];

function filtered(){
  const q = ui.q.toLowerCase();
  return TODOS.map(cur).filter(t=>{
    if ((ui.status==='removed') !== !!st.removed[t.id]) return false;
    if (ui.status==='open' && isDone(t)) return false;
    if (ui.status==='done' && !isDone(t)) return false;
    if (ui.src.size && !ui.src.has(t.src)) return false;
    if (ui.tag.size && !t.tags.some(x=>ui.tag.has(x))) return false;
    if (ui.eff.size && !ui.eff.has(t.eff)) return false;
    if (ui.overdue && t.age<5) return false;
    if (ui.blocks && !t.blocks) return false;
    if (ui.hideHeld && t.held) return false;
    if (q && !(t.title+' '+t.ctx+' '+t.tags.join(' ')+' '+t.src+' '+t.proj).toLowerCase().includes(q)) return false;
    return true;
  });
}
const sorters = {
  score:(a,b)=>score(b).total-score(a).total, age:(a,b)=>b.age-a.age, urg:(a,b)=>b.urg-a.urg, imp:(a,b)=>b.imp-a.imp,
  eff:(a,b)=>a.eff-b.eff, src:(a,b)=>a.src.localeCompare(b.src), title:(a,b)=>a.title.localeCompare(b.title),
  manual:(a,b)=>ordIdx(a.id)-ordIdx(b.id)
};

function renderList(){
  const items = filtered().sort((a,b)=> (st.pin[b.id]?1:0)-(st.pin[a.id]?1:0) || sorters[ui.sort](a,b) || score(b).total-score(a).total);
  const el = document.getElementById('list');
  if (!items.length){ el.innerHTML='<div class="empty">No todos match these filters.</div>'; renderDetail(); summary(); return; }
  const gk = {none:()=>'', quad, prio, src:t=>t.src, proj:t=>t.proj}[ui.group];
  let html='', last=null;
  const groups = {};
  items.forEach(t=>{ const g=gk(t); (groups[g]=groups[g]||[]).push(t); });
  Object.keys(groups).sort().forEach(g=>{
    if (ui.group!=='none') html += `<div class="grp">${g.replace(/^\d /,'')} <span style="font-weight:400">(${groups[g].length})</span></div>`;
    groups[g].forEach(t=>{
      const s = score(t).total;
      html += `<div class="item ${ui.sel===t.id?'sel':''} ${isDone(t)?'done':''}" data-id="${t.id}" draggable="true">
        <input type="checkbox" ${isDone(t)?'checked':''} data-done="${t.id}">
        <div><div class="title">${t.title}</div>
          <div class="meta"><span class="tag ${prio(t).toLowerCase()}">${prio(t)}</span><span class="tag">${t.src}</span><span class="tag">${t.proj}</span>
          <span class="tag">effort ${EFF[t.eff]}</span>${t.age>=5?`<span class="tag p1">${t.age}d old</span>`:t.age>0?`<span class="tag">${t.age}d</span>`:'<span class="tag ok">new</span>'}
          ${t.blocks?'<span class="tag p2">unblocks others</span>':''}${t.held?'<span class="tag">on hold</span>':''}${t.links.length>1?`<span class="tag">${t.links.length} links</span>`:''}</div></div>
        <div class="acts"><span class="pin ${st.pin[t.id]?'on':''}" data-pin="${t.id}" title="Pin to top">★</span><span class="rm" data-rm="${t.id}" title="${st.removed[t.id]?'Restore to list':'Remove from list (not done)'}">${st.removed[t.id]?'↺':'✕'}</span><span class="grip" title="Drag to reorder">⠿</span></div>
      </div>`;
    });
  });
  el.innerHTML = html;
  if (!ui.sel || !items.some(t=>t.id===ui.sel)) ui.sel = items[0].id;
  el.querySelectorAll('.item').forEach(n=>{
    if (n.dataset.id===ui.sel) n.classList.add('sel'); else n.classList.remove('sel');
  });
  renderDetail(); summary();
}

function renderDetail(){
  const r = document.getElementById('right');
  const base = TODOS.find(t=>t.id===ui.sel);
  if (!base){ r.innerHTML='<div class="empty">Select a todo.</div>'; return; }
  const t = cur(base), s = score(t);
  const maxAbs = Math.max(1,...Object.values(s.parts).map(Math.abs));
  const colors = {Urgency:'#d92d20','Impact':'#175cd3','Unblocks others':'#7a5af8',Aging:'#b54708','Quick win':'#067647','On hold':'#98a2b3',Pinned:'#f79009'};
  const bar = `<div class="bar">${Object.entries(s.parts).filter(([,v])=>v>0).map(([k,v])=>`<i title="${k}" style="width:${v/s.total*100}%;background:${colors[k]}"></i>`).join('')}</div>`;
  const rows = Object.entries(s.parts).map(([k,v])=>`<tr><td><span style="color:${colors[k]}">●</span> ${k}</td><td>${v>=0?'+':''}${v.toFixed(1)}</td></tr>`).join('');
  r.innerHTML = `
    <div class="row" style="gap:6px"><span class="tag ${prio(t).toLowerCase()}">${prio(t)}</span><span class="tag">${t.src}</span><span class="tag">${t.proj}</span>${t.tags.map(x=>`<span class="tag">#${x}</span>`).join('')}</div>
    <h2 style="margin-top:8px">${t.title}</h2>
    <div class="row" style="margin:6px 0 2px"><label class="chk"><input type="checkbox" id="dDone" ${isDone(t)?'checked':''}> done</label>
      <label class="chk"><input type="checkbox" id="dPin" ${st.pin[t.id]?'checked':''}> pinned</label>
      <span style="margin-left:auto;display:flex;gap:6px;align-items:center"><select id="ptype">${Object.entries(TYPES).map(([k,v])=>`<option value="${k}" ${k===typeOf(t)?'selected':''}>${v.n}</option>`).join('')}</select><button id="copyPrompt">Copy prompt for agent</button></span></div>
    <div class="row" style="margin:4px 0 0"><button id="mvUp">▲ Move up</button><button id="mvDown">▼ Move down</button><button id="rmBtn">${st.removed[t.id]?'↺ Restore to list':'✕ Remove from list'}</button></div>

    <h3>Context</h3><div class="card">${t.ctx}</div>

    <h3>Links (${t.links.length})</h3>
    ${t.links.length?`<ul class="links">${t.links.map(l=>`<li><a href="${l.u}">${l.t}</a></li>`).join('')}</ul>`:'<div style="color:var(--mute)">None</div>'}

    <h3>Notes</h3><textarea id="note" placeholder="Notes (saved in this browser)"></textarea>

    <details class="fold" ${ui.openWhy?'open':''} data-fold="openWhy">
      <summary>Why it ranks here (score ${s.total.toFixed(1)}, preset: ${PRESETS[ui.preset]?PRESETS[ui.preset].n:'custom'})</summary>
      <div class="card">${bar}<table class="bd" style="margin-top:8px">${rows}</table></div>
    </details>

    <details class="fold" ${ui.openAdj?'open':''} data-fold="openAdj">
      <summary>Adjust factors</summary>
      <div class="card edit">
        <label>Urgency <input type="range" min="1" max="5" value="${t.urg}" data-f="urg"> <b>${t.urg}</b></label>
        <label>Impact <input type="range" min="1" max="5" value="${t.imp}" data-f="imp"> <b>${t.imp}</b></label>
        <label>Effort <input type="range" min="1" max="3" value="${t.eff}" data-f="eff"> <b>${EFF[t.eff]}</b></label>
        <label class="chk"><input type="checkbox" data-b="blocks" ${t.blocks?'checked':''}> unblocks others</label>
        <label class="chk"><input type="checkbox" data-b="held" ${t.held?'checked':''}> on hold</label>
        <button id="reset">reset</button>
      </div>
    </details>`;
  r.querySelectorAll('details.fold').forEach(d=> d.ontoggle = ()=>{ ui[d.dataset.fold]=d.open; });
  document.getElementById('note').value = st.notes[t.id]||'';
  document.getElementById('note').oninput = e=>{ st.notes[t.id]=e.target.value; save(); };
  document.getElementById('dDone').onchange = e=>{ st.done[t.id]=e.target.checked; if(!e.target.checked) delete st.done[t.id]; save(); renderList(); };
  document.getElementById('dPin').onchange = e=>{ st.pin[t.id]=e.target.checked; if(!e.target.checked) delete st.pin[t.id]; save(); renderList(); };
  document.getElementById('copyPrompt').onclick = async e=>{
    const note = (st.notes[t.id]||'').trim();
    const prompt = [
      `Todo: ${t.title}`,
      `Source: ${t.src} | Project: ${t.proj} | Priority: ${prio(t)} | Effort: ${EFF[t.eff]} | Age: ${t.age}d${t.blocks?' | Unblocks others':''}${t.held?' | On hold':''}`,
      '',
      'Context:',
      t.ctx,
      t.links.length ? '\nLinks:\n' + t.links.map(l=>`- ${l.t}: ${l.u}`).join('\n') : '',
      note ? `\nMy notes:\n${note}` : '',
      '',
      TYPES[document.getElementById('ptype').value].instr
    ].filter((x,i,a)=>x!==''||a[i-1]!=='').join('\n');
    const btn = e.target;
    try { await navigator.clipboard.writeText(prompt); }
    catch { const ta=document.createElement('textarea'); ta.value=prompt; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
    btn.textContent='Copied ✓'; setTimeout(()=>btn.textContent='Copy prompt for agent',1500);
  };
  document.getElementById('reset').onclick = ()=>{ delete st.edit[t.id]; save(); renderList(); };
  document.getElementById('mvUp').onclick = ()=>stepMove(t.id,-1);
  document.getElementById('mvDown').onclick = ()=>stepMove(t.id,1);
  document.getElementById('rmBtn').onclick = ()=>toggleRemoved(t.id);
  r.querySelectorAll('[data-f]').forEach(n=> n.oninput = e=>{ (st.edit[t.id]=st.edit[t.id]||{})[n.dataset.f]=+e.target.value; save(); renderList(); });
  r.querySelectorAll('[data-b]').forEach(n=> n.onchange = e=>{ (st.edit[t.id]=st.edit[t.id]||{})[n.dataset.b]=e.target.checked; save(); renderList(); });
}

function summary(){
  renderSched();
  const all = TODOS.map(cur).filter(t=>!st.removed[t.id]), open = all.filter(t=>!isDone(t));
  document.getElementById('summary').textContent =
    `${open.length} open · ${all.length-open.length} done · ${open.filter(t=>prio(t)==='P0').length} P0 · ${open.filter(t=>t.age>=5).length} aging · showing ${document.querySelectorAll('.item').length}`;
}

// ---- agent prompt types ----
const TYPES = {
  review:  {n:'Review', instr:'Review the linked PRs or doc (use /code-review for PRs). Check correctness and consistency; no praise or style nits. Draft any review comments as one or two sentences: the point and, if needed, the fix. No preamble, no recap, no bolded labels. Show me the drafts and do not post anything on GitHub until I say so.'},
  merge:   {n:'Merge', instr:'Merge the linked PRs in stack order, bottom first. For each, check it is approved and CI is green before merging; skip any that are not and tell me why. Report what was merged and what was skipped.'},
  chase:   {n:'Chase reviewers', instr:'Check the current review state of the linked PRs and list who has not reviewed yet. Draft one short nudge per reviewer: one or two plain sentences, nothing template-y. Show me the drafts; do not send or post anything.'},
  reply:   {n:'Follow up on message', instr:'Read the linked Teams message and its thread and work out what, if anything, is being asked of me. If a reply is needed, draft a short one in my voice (/michel). Do not send it.'},
  dev:     {n:'Implement / continue', instr:'Read the task note and linked PRs, tell me what is done and what remains, then continue the work. Use jj, not git; keep commit subjects short; do not squash or push without my say-so.'},
  check:   {n:'Check blocker', instr:'Check whether whatever this is blocked on has cleared. Report the current status and the next step; do not change anything.'},
  generic: {n:'Generic', instr:'Pick this up: confirm your understanding of the task from the context and links, say what you plan to do, then proceed. Ask me only if something is genuinely ambiguous.'}
};
const typeOf = t => t.src==='Merge'?'merge' : t.src==='Chase review'?'chase' : t.tags.includes('review')?'review' : t.src==='Teams'?'reply' : t.src==='Blocked'?'check' : (t.src==='Backlog'&&t.tags.includes('dev'))?'dev' : 'generic';

async function copyText(text, btn, label){
  try { await navigator.clipboard.writeText(text); }
  catch { const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  btn.textContent='Copied ✓'; setTimeout(()=>btn.textContent=label,1500);
}

// ---- remove / reorder ----
const visIds = () => [...document.querySelectorAll('#list .item')].map(n=>n.dataset.id);
function ensureOrder(){ const o=st.order.slice(); TODOS.map(cur).sort((a,b)=>score(b).total-score(a).total).forEach(t=>{ if(!o.includes(t.id)) o.push(t.id); }); return o; }
function moveTo(id, targetId, before){
  const vis = visIds(), rest = ensureOrder().filter(x=>!vis.includes(x)), base = vis.filter(x=>x!==id);
  const ti = base.indexOf(targetId); if (ti<0) return;
  base.splice(before?ti:ti+1, 0, id);
  st.order = [...base, ...rest]; ui.sort='manual'; document.getElementById('sort').value='manual'; save(); renderList();
}
function stepMove(id, dir){ const vis=visIds(), n=vis[vis.indexOf(id)+dir]; if(n) moveTo(id, n, dir<0); }
function toggleRemoved(id){
  const vis = visIds(), i = vis.indexOf(id);
  if (ui.sel===id) ui.sel = vis[i+1] || vis[i-1] || null;
  st.removed[id] ? delete st.removed[id] : st.removed[id]=true; save(); renderList();
}

// ---- backlog update prompt ----
function buildBacklogPrompt(){
  const all = TODOS.map(cur), live = all.filter(t=>!st.removed[t.id]);
  const done = live.filter(isDone), open = live.filter(t=>!isDone(t)), removed = all.filter(t=>st.removed[t.id]);
  const fmt = t => `- ${t.title} (${t.src}${t.links.some(l=>l.t==='Task note')?', has a task note':''})`;
  return [
    `Update my vault backlog for ${DAY}: /Users/meain/.local/share/sbdb/Backlog/Backlog.md. Use the /vault skill and follow the existing backlog format.`,
    done.length ? `\nDone (mark completed):\n${done.map(fmt).join('\n')}` : '',
    removed.length ? `\nRemoved from today's list on purpose (not completed; take them off the list, do not tick them):\n${removed.map(fmt).join('\n')}` : '',
    open.length ? `\nStill open (no change needed):\n${open.map(fmt).join('\n')}` : '',
    '\nOnly touch the items listed under Done and Removed. Match existing lines by title or their [[Tasks/...]] link. Done items that are not in the backlog yet (PR reviews, merges, Teams follow-ups) should be added as completed lines under today\'s section so they show up in the weekly report. Show me what you changed when you are done.'
  ].filter(x=>x!=='').join('\n');
}

// ---- schedule (calendar baked in at generation time, IST) ----
const DAY = DATA.day, WORK_START = 9*60, WORK_END = 24*60+30;
const EVENTS = DATA.events;
const EFFMIN = {1:15, 2:45, 3:120};
const mins = s => { const [h,m]=s.split(':').map(Number); return h*60+m; };
const fmtT = m => { const h=Math.floor(m/60)%24, mm=m%60; return `${((h+11)%12)+1}:${String(mm).padStart(2,'0')} ${h<12?'AM':'PM'}`; };
const fmtD = m => m>=60 ? `${Math.floor(m/60)}h${m%60?` ${m%60}m`:''}` : `${m}m`;
function nowMins(){
  const p = new URLSearchParams(location.search).get('now'); if (p) return mins(p);
  const parts = new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kolkata',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date());
  const g = k => parts.find(x=>x.type===k).value, day = `${g('year')}-${g('month')}-${g('day')}`;
  if (day<DAY) return 0; if (day>DAY) return 99999;
  return +g('hour')*60 + +g('minute');
}
function planOrder(){
  const l = TODOS.map(cur).filter(t=>!isDone(t)&&!st.removed[t.id]&&!t.held);
  return ui.sort==='manual'
    ? l.sort((a,b)=>ordIdx(a.id)-ordIdx(b.id)||score(b).total-score(a).total)
    : l.sort((a,b)=>(st.pin[b.id]?1:0)-(st.pin[a.id]?1:0)||score(b).total-score(a).total);
}
function renderSched(){
  const el = document.getElementById('sched'), now = nowMins(), from = Math.max(now, WORK_START);
  const evs = EVENTS.filter(e=>!(ui.skipOptional&&e.opt)).map(e=>({...e, s:mins(e.s), e:mins(e.e)}));
  const busy = evs.map(e=>[Math.max(e.s,from), Math.min(e.e,WORK_END)]).filter(([a,b])=>b>a).sort((a,b)=>a[0]-b[0]);
  const free = []; let c = from;
  busy.forEach(([a,b])=>{ if (a-c>=15) free.push({s:c,e:a,used:0,items:[]}); c = Math.max(c,b); });
  if (WORK_END-c>=15 && from<WORK_END) free.push({s:c,e:WORK_END,used:0,items:[]});
  const nofit = [];
  planOrder().forEach(t=>{
    const m = EFFMIN[t.eff], f = free.find(x=>x.e-x.s-x.used>=m);
    if (f){ f.items.push({t, at:f.s+f.used}); f.used += m; } else nofit.push(t);
  });
  const rows = [
    ...evs.filter(e=>e.e>from).map(e=>({s:Math.max(e.s,from), html:`<div class="blk meet"><span>${fmtT(Math.max(e.s,from))} – ${fmtT(e.e)}</span><span>${e.t}${e.opt?' <span class="tag">optional</span>':''}</span></div>`})),
    ...free.map(f=>({s:f.s, html:`<div class="blk focus"><span class="when">${fmtT(f.s)} – ${fmtT(f.e)}<br><span style="font-weight:400;color:var(--mute)">${fmtD(f.e-f.s)} free · ${fmtD(f.used)} planned</span></span><span class="plan">${f.items.length?f.items.map(({t,at})=>`<div data-sel="${t.id}">${fmtT(at)} · [${EFF[t.eff]}] ${t.title}</div>`).join(''):'<span style="color:var(--mute)">nothing fits</span>'}</span></div>`}))
  ].sort((a,b)=>a.s-b.s);
  const over = evs.filter(e=>e.e<=from).length;
  el.innerHTML = `<details ${ui.openSched===false?'':'open'}><summary>Today's schedule · ${DAY}${now>=99999?' · day is over':''}</summary>
    ${over?`<div class="blk meet"><span></span><span>${over} meeting${over>1?'s':''} already over</span></div>`:''}
    ${rows.map(r=>r.html).join('') || '<div class="blk meet"><span></span><span>Nothing left to schedule today.</span></div>'}
    ${nofit.length?`<div class="blk"><span style="color:var(--amber)">Won't fit (${nofit.length})</span><span class="plan">${nofit.map(t=>`<div data-sel="${t.id}">[${EFF[t.eff]}] ${t.title}</div>`).join('')}</span></div>`:''}
    <div class="blk"><span></span><label class="chk"><input type="checkbox" id="skipOpt" ${ui.skipOptional?'checked':''}> treat optional meetings as free</label></div>
  </details>`;
  el.querySelector('details').ontoggle = e=>{ ui.openSched = e.target.open; };
  el.querySelector('#skipOpt').onchange = e=>{ ui.skipOptional = e.target.checked; renderSched(); };
  el.onclick = e=>{ const n=e.target.closest('[data-sel]'); if (n){ ui.sel=n.dataset.sel; renderList(); } };
}

function chips(id, vals, set, fmt=x=>x){
  const el = document.getElementById(id);
  el.innerHTML = vals.map(v=>`<span class="chip ${set.has(v)?'on':''}" data-v="${v}">${fmt(v)}</span>`).join('');
  el.onclick = e=>{ const v=e.target.dataset.v; if(v===undefined) return; const k = typeof vals[0]==='number'?+v:v;
    set.has(k)?set.delete(k):set.add(k); chips(id,vals,set,fmt); renderList(); };
}

function buildSliders(){
  document.getElementById('sliders').innerHTML = SLIDERS.map(([k,n,lo,hi])=>
    `<label>${n}<span><input type="range" min="${lo}" max="${hi}" step="0.5" value="${ui.w[k]}" data-w="${k}"> <b>${ui.w[k]}</b></span></label>`).join('');
  document.querySelectorAll('[data-w]').forEach(n=> n.oninput = e=>{ ui.w[n.dataset.w]=+e.target.value; n.nextElementSibling.textContent=e.target.value;
    ui.preset='custom'; document.getElementById('preset').value='custom'; renderList(); });
}

function init(){
  document.getElementById('gen').textContent = DATA.subtitle; document.title = DATA.title;
  const all = TODOS;
  chips('srcChips',[...new Set(all.map(t=>t.src))],ui.src);
  chips('tagChips',[...new Set(all.flatMap(t=>t.tags))].sort(),ui.tag,x=>'#'+x);
  chips('effChips',[1,2,3],ui.eff,x=>EFF[x]);
  const ps = document.getElementById('preset');
  ps.innerHTML = Object.entries(PRESETS).map(([k,p])=>`<option value="${k}">${p.n}</option>`).join('')+'<option value="custom">Custom (sliders)</option>';
  ps.onchange = e=>{ const k=e.target.value; ui.preset=k; if(PRESETS[k]){ ui.w={...PRESETS[k]}; buildSliders(); }
    ui.sort='score'; document.getElementById('sort').value='score'; renderList(); };
  document.getElementById('q').oninput = e=>{ ui.q=e.target.value; renderList(); };
  document.getElementById('status').onchange = e=>{ ui.status=e.target.value; renderList(); };
  document.getElementById('sort').onchange = e=>{ ui.sort=e.target.value; renderList(); };
  document.getElementById('group').onchange = e=>{ ui.group=e.target.value; renderList(); };
  document.getElementById('fOverdue').onchange = e=>{ ui.overdue=e.target.checked; renderList(); };
  document.getElementById('fBlocksOthers').onchange = e=>{ ui.blocks=e.target.checked; renderList(); };
  document.getElementById('fHideHeld').onchange = e=>{ ui.hideHeld=e.target.checked; renderList(); };
  document.getElementById('list').onclick = e=>{
    const d = e.target.dataset;
    if (d.done){ st.done[d.done]=e.target.checked; if(!e.target.checked) delete st.done[d.done]; save(); renderList(); return; }
    if (d.pin){ st.pin[d.pin]?delete st.pin[d.pin]:st.pin[d.pin]=true; save(); renderList(); return; }
    if (d.rm){ toggleRemoved(d.rm); return; }
    const it = e.target.closest('.item'); if (it){ ui.sel=it.dataset.id; renderList(); }
  };
  document.getElementById('backlogPrompt').onclick = e=>copyText(buildBacklogPrompt(), e.target, 'Copy backlog update prompt');
  const lst = document.getElementById('list'); let dragId = null;
  const clearOver = ()=>lst.querySelectorAll('.over-t,.over-b').forEach(n=>n.classList.remove('over-t','over-b'));
  lst.ondragstart = e=>{ const it=e.target.closest('.item'); if(!it) return; dragId=it.dataset.id; e.dataTransfer.effectAllowed='move'; it.classList.add('drag'); };
  lst.ondragend = ()=>{ dragId=null; clearOver(); lst.querySelectorAll('.drag').forEach(n=>n.classList.remove('drag')); };
  lst.ondragover = e=>{ const it=e.target.closest('.item'); if(!it||!dragId) return; e.preventDefault(); const r=it.getBoundingClientRect(); clearOver(); it.classList.add(e.clientY<r.top+r.height/2?'over-t':'over-b'); };
  lst.ondrop = e=>{ const it=e.target.closest('.item'); if(!it||!dragId||it.dataset.id===dragId) return; e.preventDefault(); const r=it.getBoundingClientRect(); moveTo(dragId, it.dataset.id, e.clientY<r.top+r.height/2); };
  setInterval(renderSched, 60000);
  buildSliders(); renderList();
}
init();
</script>
</body>
