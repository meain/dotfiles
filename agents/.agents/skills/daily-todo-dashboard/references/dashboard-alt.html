<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Todo dashboard</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.45 -apple-system,system-ui,sans-serif;background:#f6f7f9;color:#1d2330;display:flex;flex-direction:column}
header{display:flex;gap:14px;align-items:center;padding:12px 24px;background:#fff;border-bottom:1px solid #dde1e8}
header h1{font-size:18px;margin:0}
.sub{color:#889;font-size:12.5px}.sp{margin-left:auto}
button{font:inherit;font-size:13px;padding:6px 12px;border:1px solid #cfd5df;border-radius:8px;background:#fff;cursor:pointer}
button.p{background:#2f6fed;color:#fff;border-color:#2f6fed}
.views button.on{background:#1d2330;color:#fff;border-color:#1d2330}
#next{background:#fff;border-bottom:1px solid #dde1e8;padding:8px 24px;font-size:13px;display:none;gap:10px;flex-wrap:wrap;align-items:center}
#next .lbl{color:#889;font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.ev{background:#eef0f4;border-radius:8px;padding:3px 10px;color:#334}
.ev.nx{background:#1d2330;color:#fff}.ev.past{opacity:.45}
.ev i{font-style:normal;color:#889;margin-right:6px}.ev.nx i{color:#aab}
#app{flex:1;display:grid;grid-template-columns:1fr 420px;gap:16px;padding:16px 24px;overflow:hidden}
#main{overflow:auto}
.pill{font-size:11px;padding:1px 7px;border-radius:99px;background:#e6ecfb;color:#2a4fa8;white-space:nowrap}
.pill.m{background:#e3f4e8;color:#23703a}.pill.t{background:#fdeed8;color:#9a5b0a}.pill.r{background:#fde6e6;color:#a32a2a}.pill.g{background:#eef0f4;color:#556}
/* list view */
.sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#889;margin:18px 0 4px}
.sec:first-child{margin-top:0}
.row{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid #e1e5ec;border-radius:10px;padding:10px 14px;margin:6px 0;cursor:pointer}
.row.sel,.card.sel,tr.sel{outline:2px solid #2f6fed}
/* type colors */
.s-Merge{--c:#2e9e57}.s-Chase{--c:#e08a1e}.s-PR{--c:#2f6fed}.s-Teams{--c:#8a4fd8}.s-Backlog{--c:#7b8494}.s-Blocked{--c:#d04a4a}
.pill.src{background:color-mix(in srgb,var(--c) 15%,#fff);color:color-mix(in srgb,var(--c) 70%,#000)}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;font-size:12px;color:#556}
.fb{display:flex;align-items:center;gap:6px;border-radius:99px;padding:4px 12px;font-size:12.5px;color:#334}
.fb i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.fb.on{background:#1d2330;color:#fff;border-color:#1d2330}
.fb.s-Merge.on,.fb.s-Chase.on,.fb.s-PR.on,.fb.s-Teams.on,.fb.s-Backlog.on,.fb.s-Blocked.on{background:var(--c);border-color:var(--c);color:#fff}
.fb.on i{background:#fff}
.x{border:0;background:none;color:#aab;padding:0 4px;font-size:16px;line-height:1}.x:hover{color:#a32a2a}
.ign{margin-top:18px;color:#667;font-size:13px}
.ign .row{opacity:.7}
.row.done .t,.card.done .t,tr.done td{text-decoration:line-through;color:#aab}
.row .t{flex:1}
/* table view */
table.tb{width:100%;border-collapse:collapse;background:#fff;border:1px solid #e1e5ec;border-radius:10px;overflow:hidden}
.tb th{background:#f1f3f7;text-align:left;font-weight:400;color:#667;font-size:12px;padding:8px 10px;cursor:pointer;user-select:none}
.tb td{padding:8px 10px;border-top:1px solid #eef0f4;vertical-align:middle}
.tb tr{cursor:pointer}.tb tr:hover td{background:#f8faff}
/* cards view */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:#fff;border:1px solid #e1e5ec;border-radius:12px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:8px}
.card .t{font-size:15px}.card .c{color:#667;font-size:12.5px;flex:1}
.card .tags{display:flex;gap:5px;flex-wrap:wrap}
#drawer{background:#fff;border:1px solid #2f6fed;border-radius:12px;padding:18px;overflow:auto}
#drawer.empty{border-color:#e1e5ec;color:#889}
#drawer h2{margin:0 0 6px;font-size:18px}
.k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#889;margin:16px 0 4px}
.lt{width:100%;border-collapse:collapse;font-size:13px}.lt td{padding:5px 0;border-top:1px solid #eef0f4}
a{color:#2f6fed;text-decoration:none}
textarea{width:100%;min-height:70px;font:inherit;border:1px solid #dde1e8;border-radius:8px;padding:8px}
.acts button{margin:4px 6px 0 0}
</style></head><body>
<header><h1 id="title"></h1><span class="sub" id="summary"></span>
<span class="sp views"><button data-v="list">List</button> <button data-v="table">Table</button> <button data-v="cards">Cards</button></span>
<button id="backlogPrompt" title="Copy backlog update prompt">Backlog prompt</button></header>
<div id="next"></div>
<div id="app"><div id="main"></div><aside id="drawer" class="empty">Select an item.</aside></div>

<script>
const DATA = /*DATA_JSON*/null;
const KEY = 'todo-dash-alt-' + DATA.day;
const st = Object.assign({done:{},notes:{},ignored:{},filter:[],view:'list'}, JSON.parse(localStorage.getItem(KEY)||'{}'));
const sc = t => 's-' + ({'Chase review':'Chase','PR review':'PR'}[t.src]||t.src);
const TYPES = [['Merge','Merge'],['Chase review','Chase'],['PR review','PR'],['Teams','Teams'],['Backlog','Backlog'],['Blocked','Blocked']];
const live = () => DATA.todos.filter(t=>!st.ignored[t.id]);
const ignore = id => { st.ignored[id]=true; if(sel===id) sel=null; save(); render(); drawer(); summary(); };
const restore = id => { delete st.ignored[id]; save(); render(); summary(); };
const save = () => localStorage.setItem(KEY, JSON.stringify(st));
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const score = t => t.urg*2 + t.imp*2 + (t.blocks?3:0) + Math.min(t.age,10)*0.3 - (t.held?8:0);
const tier = t => t.held ? 'On hold' : score(t) >= 17 ? 'High priority' : score(t) >= 12 ? 'Normal' : 'Low';
const sorted = () => live().filter(t=>!st.filter.length || st.filter.includes(t.src)).sort((a,b)=>score(b)-score(a));
let sel = null, sortKey = null, sortDir = -1;

const flags = t => [t.blocks?'<span class="pill r">blocks someone</span>':'', t.age>=5?`<span class="pill r">${t.age}d</span>`:'', t.held?'<span class="pill g">on hold</span>':''].join(' ');
const tick = t => `<input type="checkbox" data-done="${esc(t.id)}" ${st.done[t.id]?'checked':''}>`;

function viewList(){
  const g = {}; sorted().forEach(t => (g[tier(t)] = g[tier(t)]||[]).push(t));
  return ['High priority','Normal','Low','On hold'].filter(k=>g[k]).map(k =>
    `<div class="sec">${k} (${g[k].length})</div>` + g[k].map(t =>
      `<div class="row ${sc(t)} ${sel===t.id?'sel':''} ${st.done[t.id]?'done':''}" data-id="${esc(t.id)}">${tick(t)}<span class="t">${esc(t.title)}</span>${flags(t)}<span class="pill src">${esc(t.src)}</span><button class="x" data-ign="${esc(t.id)}" title="Ignore">×</button></div>`).join('')).join('');
}
function viewTable(){
  const cols = [['title','Todo'],['src','Source'],['proj','Project'],['age','Age'],['score','Priority']];
  let rows = sorted();
  if (sortKey) rows.sort((a,b)=>{ const f=t=>sortKey==='score'?score(t):t[sortKey]; const x=f(a),y=f(b); return (x>y?1:x<y?-1:0)*sortDir; });
  return `<table class="tb"><tr><th></th>${cols.map(([k,l])=>`<th data-sort="${k}">${l}${sortKey===k?(sortDir>0?' ▲':' ▼'):''}</th>`).join('')}<th>Flags</th></tr>` +
    rows.map(t=>`<tr class="${sc(t)} ${sel===t.id?'sel':''} ${st.done[t.id]?'done':''}" data-id="${esc(t.id)}"><td>${tick(t)}</td><td>${esc(t.title)}</td><td><span class="pill src">${esc(t.src)}</span></td><td>${esc(t.proj)}</td><td>${t.age}d</td><td>${tier(t)}</td><td>${flags(t)}</td></tr>`).join('') + '</table>';
}
function viewCards(){
  return '<div class="cards">' + sorted().map((t,i)=>
    `<div class="card ${sc(t)} ${sel===t.id?'sel':''} ${st.done[t.id]?'done':''}" data-id="${esc(t.id)}"><div style="display:flex;gap:8px;align-items:center">${tick(t)}<span class="pill src">${esc(t.src)}</span><span class="pill">${esc(t.proj)}</span></div>
     <div class="t">${esc(t.title)}</div><div class="c">${esc(t.ctx.length>110?t.ctx.slice(0,110)+'…':t.ctx)}</div><div class="tags">${flags(t)}<span class="pill g">${t.links.length} link${t.links.length===1?'':'s'}</span></div></div>`).join('') + '</div>';
}
function render(){
  document.querySelectorAll('.views button').forEach(b=>b.classList.toggle('on',b.dataset.v===st.view));
  const cnt = s => live().filter(t=>t.src===s).length;
  const legend = '<div class="legend"><button class="fb ' + (st.filter.length?'':'on') + '" data-f="">All (' + live().length + ')</button>' +
    TYPES.map(([s,k])=>`<button class="fb s-${k} ${st.filter.includes(s)?'on':''}" data-f="${s}"><i></i>${s} (${cnt(s)})</button>`).join('') + '</div>';
  const ign = DATA.todos.filter(t=>st.ignored[t.id]);
  const ignHtml = ign.length ? `<details class="ign"><summary>Ignored (${ign.length})</summary>` + ign.map(t=>
    `<div class="row ${sc(t)}"><span class="t">${esc(t.title)}</span><span class="pill src">${esc(t.src)}</span><button data-restore="${esc(t.id)}">Restore</button></div>`).join('') + '</details>' : '';
  document.getElementById('main').innerHTML = legend + {list:viewList,table:viewTable,cards:viewCards}[st.view]() + ignHtml;
  document.querySelectorAll('[data-f]').forEach(e=>e.onclick=()=>{
    const f=e.dataset.f;
    st.filter = !f ? [] : st.filter.includes(f) ? st.filter.filter(x=>x!==f) : [...st.filter, f];
    save(); render(); });
  document.querySelectorAll('[data-ign]').forEach(e=>e.onclick=ev=>{ ev.stopPropagation(); ignore(e.dataset.ign); });
  document.querySelectorAll('[data-restore]').forEach(e=>e.onclick=()=>restore(e.dataset.restore));
  document.querySelectorAll('[data-id]').forEach(e=>e.onclick=ev=>{ if(ev.target.dataset.done) return; sel=e.dataset.id; render(); drawer(); });
  document.querySelectorAll('[data-done]').forEach(e=>e.onchange=()=>{ if(e.checked) st.done[e.dataset.done]=true; else delete st.done[e.dataset.done]; save(); render(); summary(); });
  document.querySelectorAll('[data-sort]').forEach(e=>e.onclick=()=>{ sortDir = sortKey===e.dataset.sort ? -sortDir : -1; sortKey=e.dataset.sort; render(); });
}
function drawer(){
  const d=document.getElementById('drawer'), t=DATA.todos.find(x=>x.id===sel);
  if(!t){ d.className='empty'; d.textContent='Select an item.'; return; }
  d.className='';
  d.innerHTML = `<h2>${esc(t.title)}</h2>${flags(t)} <span class="pill src ${sc(t)}">${esc(t.src)}</span> <span class="pill g">${esc(t.proj)}</span>
   <div class="k">Why</div>${esc(t.ctx)}
   ${t.links.length?`<div class="k">Links</div><table class="lt">${t.links.map(l=>`<tr><td><a href="${esc(l.u)}" target="_blank">${esc(l.t)}</a></td></tr>`).join('')}</table>`:''}
   <div class="k">Notes</div><textarea id="note">${esc(st.notes[t.id]||'')}</textarea>
   <div class="k">Actions</div><div class="acts"><button class="p" id="cp">Copy agent prompt</button><button id="dn">${st.done[t.id]?'Mark open':'Mark done'}</button><button id="ig">Ignore for today</button></div>`;
  document.getElementById('ig').onclick=()=>ignore(t.id);
  document.getElementById('note').oninput=e=>{st.notes[t.id]=e.target.value;save();};
  document.getElementById('dn').onclick=()=>{ if(st.done[t.id]) delete st.done[t.id]; else st.done[t.id]=true; save(); render(); drawer(); summary(); };
  document.getElementById('cp').onclick=e=>copy(prompt(t),e.target,'Copy agent prompt');
}
function prompt(t){
  const kind = t.tags.includes('review') ? 'Review these changes for correctness bugs and gaps. Report concise findings; do not post anything to GitHub.'
    : t.tags.includes('dev') ? 'Plan and implement this. Show me the plan first if it is non-trivial.' : 'Do what is needed to finish this, and tell me what you did.';
  const note=(st.notes[t.id]||'').trim();
  return [`Todo: ${t.title}`,`Source: ${t.src} | Project: ${t.proj} | Age: ${t.age}d`,'','Context:',t.ctx,
    t.links.length?'\nLinks:\n'+t.links.map(l=>`- ${l.t}: ${l.u}`).join('\n'):'', note?`\nMy notes:\n${note}`:'','',kind].filter((x,i,a)=>x!==''||a[i-1]!=='').join('\n');
}
async function copy(text,btn,label){
  try{await navigator.clipboard.writeText(text);}catch{const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();}
  btn.textContent='Copied ✓'; setTimeout(()=>btn.textContent=label,1500);
}
function summary(){
  const open=live().filter(t=>!st.done[t.id]), ni=Object.keys(st.ignored).length;
  document.getElementById('summary').textContent=`${ni?ni+' ignored · ':''}${open.length} open · ${open.filter(t=>t.age>=5).length} aging 5d+ · ${open.filter(t=>t.blocks).length} block others`;
}
function events(){
  const mins=s=>{const[h,m]=s.split(':').map(Number);return h*60+m;};
  const fmt=m=>{const h=Math.floor(m/60)%24,mm=m%60;return `${((h+11)%12)+1}:${String(mm).padStart(2,'0')} ${h<12?'AM':'PM'}`;};
  const n=new Date(), cur=n.getHours()*60+n.getMinutes();
  const ev=(DATA.events||[]).map(e=>({...e,sm:mins(e.s),em:mins(e.e)})).sort((a,b)=>a.sm-b.sm);
  if(!ev.length) return;
  const nx=ev.find(e=>e.sm>cur), el=document.getElementById('next');
  el.style.display='flex';
  el.innerHTML='<span class="lbl">Today</span>'+ev.map(e=>`<span class="ev ${e===nx?'nx':''} ${e.em<=cur?'past':''}"><i>${fmt(e.sm)} to ${fmt(e.em)}</i>${esc(e.t)}</span>`).join('');
}
document.querySelectorAll('.views button').forEach(b=>b.onclick=()=>{st.view=b.dataset.v;save();render();});
document.getElementById('backlogPrompt').onclick=e=>{
  const done=live().filter(t=>st.done[t.id]), open=live().filter(t=>!st.done[t.id]), ign=DATA.todos.filter(t=>st.ignored[t.id]);
  const f=t=>`- ${t.title} (${t.src}${t.links.some(l=>l.t==='Task note')?', has a task note':''})`;
  copy([`Update my vault backlog for ${DATA.day}: /Users/meain/.local/share/sbdb/Backlog/Backlog.md. Use the /vault skill and follow the existing backlog format.`,
   done.length?`\nDone (mark completed):\n${done.map(f).join('\n')}`:'', ign.length?`\nIgnored on purpose (not completed; do not tick them):\n${ign.map(f).join('\n')}`:'', open.length?`\nStill open (no change needed):\n${open.map(f).join('\n')}`:'',
   "\nOnly touch the items listed under Done. Match existing lines by title or their [[Tasks/...]] link. Done items not in the backlog yet should be added as completed lines under today's section. Show me what you changed when you are done."].filter(x=>x!=='').join('\n'),e.target,'Backlog prompt');
};
const d=new Date(DATA.day+'T00:00:00');
document.getElementById('title').textContent=d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
document.getElementById('title').title=DATA.subtitle; document.title=DATA.title;
render(); summary(); events();
</script></body></html>
