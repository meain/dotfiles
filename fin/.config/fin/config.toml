[models]
  primary = "sonnet"
  secondary = "haiku"

[settings]
  project_file = "AGENTS.md"
  max_turns = 200
  approve = "all"
  skills_dirs = ["/Users/meain/dev/veeam/oncall-copilot-plugins/plugins/data-pipelines/skills"]

[model_aliases]
  # most used
  fast = "flash"
  cheap = "luna" # a good cheap one
  free = "openrouter/poolside/laguna-s-2.1:free"
  ofree = "openrouter/openrouter/free"

  # groq
  groq = "groq/openai/gpt-oss-120b"

  # ollama
  qwen = "ollama/qwen3:4b"
  jan = "ollama/hf.co/Menlo/Jan-nano-gguf:Q4_K_M"

  # openrouter
  flash = "openrouter/deepseek/deepseek-v4.1-flash"
  luna = "openrouter/openai/gpt-6-luna"
  gflash = "openrouter/z-ai/glm-5.3-flash"

  # anthropic
  haiku = "anthropic/claude-haiku-4-5"
  sonnet = "anthropic/claude-sonnet-5-5"
  opus = "anthropic/claude-opus-5-5"

[providers]
  [providers.anthropic]
    base_url = "https://api.anthropic.com"
    api_key_env = "ANTHROPIC_API_KEY"
  [providers.openai]
    base_url = "https://api.openai.com"
    api_key_env = "OPENAI_API_KEY"
  [providers.openrouter]
    base_url = "https://openrouter.ai/api"
    api_key_env = "OPENROUTER_API_KEY"
  [providers.groq]
    base_url = "https://api.groq.com/openai"
    api_key_env = "GROQ_API_KEY"
  [providers.ollama]
    base_url = "http://localhost:11434"
    api_key_env = "OLLAMA_API_KEY"